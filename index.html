<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Полка</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #eef1f6;
        background: radial-gradient(1200px 600px at 70% -10%, #1c2230, #0f1115);
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      .logo {
        font-size: 4rem;
        filter: drop-shadow(0 6px 16px rgba(255, 122, 60, 0.35));
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(3rem, 12vw, 6rem);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.75rem 0 0;
        color: #9aa4b2;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">🦊</div>
      <h1>Полка</h1>
      <p>polkafox · GitHub Pages</p>
    </main>
  </body>
</html>
